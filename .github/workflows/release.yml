name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    name: Build and publish Linux release artifact
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake zip doxygen

      - name: Configure Lab 1 (Release build)
        run: |
          cmake -S lab1 -B release-build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Lab 1 applications
        run: cmake --build release-build -j

      - name: Generate Doxygen documentation
        run: cmake --build release-build --target docs

      - name: Package release artifact
        run: |
          mkdir -p dist/lab1/bin
          cp release-build/rectangle/RectangleApp dist/lab1/bin/
          cp release-build/set/SetApp dist/lab1/bin/
          chmod +x dist/lab1/bin/RectangleApp dist/lab1/bin/SetApp
          cp -r release-build/docs/html dist/lab1/docs

          # Console-menu launchers for use from a file manager
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'cd "$(dirname "$(readlink -f "$0")")"' \
            'exec ./bin/RectangleApp' \
            > dist/lab1/run_RectangleApp.sh
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'cd "$(dirname "$(readlink -f "$0")")"' \
            'exec ./bin/SetApp' \
            > dist/lab1/run_SetApp.sh
          chmod +x dist/lab1/run_RectangleApp.sh dist/lab1/run_SetApp.sh

          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=Rectangle App (Lab 1.3)' \
            'Exec=bash -c '"'"'cd "$(dirname "%k")" && ./bin/RectangleApp'"'"'' \
            'Terminal=true' \
            'Categories=Application;' \
            > dist/lab1/RectangleApp.desktop
          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=Set App (Lab 1.4.1)' \
            'Exec=bash -c '"'"'cd "$(dirname "%k")" && ./bin/SetApp'"'"'' \
            'Terminal=true' \
            'Categories=Application;' \
            > dist/lab1/SetApp.desktop

          printf '%s\n' \
            '# How to run Lab 1' \
            '' \
            'These are console menu programs: they run in a terminal.' \
            '' \
            'From a file manager: double-click run_RectangleApp.sh or run_SetApp.sh' \
            '(or the two .desktop launchers, depending on your desktop environment).' \
            '' \
            'From a terminal:' \
            '' \
            '    cd lab1' \
            '    ./bin/RectangleApp' \
            '    ./bin/SetApp' \
            '' \
            'Full class documentation: open docs/index.html in a browser.' \
            > dist/lab1/RUN.md
          cp -r lab1/rectangle/src dist/lab1/rectangle_src
          cp -r lab1/set/src dist/lab1/set_src
          cp -r lab1/rectangle/tests dist/lab1/rectangle_tests
          cp -r lab1/set/tests dist/lab1/set_tests
          cp lab1/CMakeLists.txt dist/lab1/
          cp README.md dist/
          cd dist && zip -r ../lab1_linux.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lab1-${{ github.run_number }}
          name: Lab 1 - Linux build ${{ github.run_number }}
          body: |
            Automated release build of Lab 1 (variants 1.3 Rectangle and 1.4.1 Set).

            Contents:
            - bin/RectangleApp, bin/SetApp - Linux console executables
            - Full Doxygen HTML documentation (docs/)
            - Source code and unit tests
            - Build instructions in the repository README
          files: lab1_linux.zip
